version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: symptom-logger-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: symptom-logger
    volumes:
      - mongodb_data:/data/db
    networks:
      - symptom-logger-network

  backend:
    build: .
    container_name: symptom-logger-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/symptom-logger?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-here
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - symptom-logger-network
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:

networks:
  symptom-logger-network:
    driver: bridge
